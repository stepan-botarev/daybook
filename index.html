<meta name="theme-color" content="#D8CCAF">
<meta property="og:title" content="Daybook">
<meta property="og:description" content="Your weekly class timetable from an .ics file. Stays on your device.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* One column, 900px max. Tabs switch between the week grid and day cards. One beige look by choice. */
  :root {
    --bg: #D8CCAF;
    --panel: #E9DFC8;
    --field: #F3ECDB;
    --ink: #1B1A33;
    --muted: #5C5442;
    --line: #A79C83;
    --free: #CFC2A3;
    --lec: #2352A6;
    --lec-ink: #F3ECDB;
    --sem: #EC6532;
    --sem-ink: #1B1A33;
    --danger: #8A1F10;
    --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 900px; margin: 0 auto; padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 20px;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
  .brand { display: flex; flex-direction: column; gap: 6px; }
  h1.logo { margin: 0; line-height: 0; }
  .logo-svg { display: block; height: 60px; width: auto; }
  .sub { margin: 0; font-size: 15px; font-weight: 500; }
  .head-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lang { display: flex; }
  .lang button { min-height: 40px; min-width: 44px; padding: 0 10px; border: 2px solid var(--ink); background: var(--panel); font: 600 13px var(--font); cursor: pointer; margin-left: -2px; }
  .lang button:first-child { margin-left: 0; }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--lec-ink); }

  .btn { min-height: 44px; padding: 0 16px; border: 2px solid var(--ink); background: var(--panel); font: 600 15px var(--font); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn:hover { filter: brightness(1.05); }
  .btn.primary { background: var(--sem); box-shadow: 3px 3px 0 var(--ink); }
  .btn.small { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.danger.sure { background: var(--danger); color: var(--lec-ink); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--lec); outline-offset: 2px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  nav.tabs button { min-height: 48px; padding: 0 16px; border: 2px solid var(--ink); background: var(--panel); font: 600 15px var(--font); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; }
  nav.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--lec-ink); }
  nav.tabs .today { font: 500 11px/1 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  nav.tabs button.is-today:not([aria-pressed="true"]) { box-shadow: inset 0 -4px 0 var(--sem); }

  .box { border: 3px solid var(--ink); background: var(--panel); }
  .bar { min-height: 32px; border-bottom: 3px solid var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  h2.bar { margin: 0; }
  .lec { background: var(--lec); color: var(--lec-ink); }
  .sem { background: var(--sem); color: var(--sem-ink); }

  /* Week grid */
  .grid-scroll { overflow-x: auto; }
  .grid { min-width: 560px; padding: 14px; display: grid; grid-template-columns: 64px repeat(var(--n, 5), minmax(0, 1fr)); gap: 8px; }
  .grid .head { font-weight: 700; text-align: center; }
  .time b { display: block; font-size: 16px; }
  .time span { font-size: 13px; color: var(--muted); }
  .cellwrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .cell { min-height: 86px; border: 2px solid var(--ink); padding: 9px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; width: 100%; text-align: left; cursor: pointer; min-width: 0; overflow: hidden; }
  .cell.empty { border: 2px dashed var(--line); cursor: default; }
  button.cell:hover { filter: brightness(1.08); }
  .cell .abbr { font-size: 20px; font-weight: 700; line-height: 1; display: flex; justify-content: space-between; align-items: flex-start; }
  .cell small { display: block; font-size: 12px; line-height: 16px; overflow-wrap: anywhere; }
  .cell.is-today { outline: 3px solid var(--ink); outline-offset: 2px; }
  .half { font-size: 12px; font-weight: 700; line-height: 1; padding: 2px 5px; background: var(--ink); color: var(--lec-ink); }

  .row { display: flex; flex-wrap: wrap; gap: 20px; }
  .row > .box { flex: 1 1 260px; min-width: 0; }
  .row > .box.wide { flex: 2 1 380px; }
  .list { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .list div { display: flex; gap: 12px; align-items: center; }
  .list b { width: 44px; flex-shrink: 0; }
  .sw { width: 16px; height: 16px; flex-shrink: 0; border: 2px solid var(--ink); }
  .once-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 10px 14px; border-top: 2px solid var(--line); font-size: 14px; }
  .once-row:first-of-type { border-top: 0; }
  .once-row .grow { flex: 1 1 200px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }

  /* Day view */
  .day-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .day-head h2 { margin: 0; font-size: 28px; line-height: 1.1; }
  .day-head span { font-size: 15px; font-weight: 600; }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card-body { padding: 10px 14px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 16px; }
  .card-main { font-size: 14px; flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 3px; overflow-wrap: anywhere; }
  .card-title { font-size: 17px; font-weight: 700; line-height: 22px; }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border: 2px solid var(--ink); }
  .tag.b { background: var(--ink); color: var(--lec-ink); }
  .tag.now { background: var(--sem); }
  .pic { border: 3px solid var(--ink); width: 100%; line-height: 0; aspect-ratio: 3.8 / 1; overflow: hidden; }
  .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Welcome / empty */
  .hero { max-width: 560px; margin: 8px auto 0; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .hero h2 { margin: 0; font-size: 26px; line-height: 1.15; }
  .hero p { margin: 0; }
  .note { font-size: 13px; color: var(--muted); }

  /* Forms and dialog */
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  .in { min-height: 44px; border: 2px solid var(--ink); background: var(--field); padding: 8px 10px; font-size: 16px; font-weight: 400; width: 100%; border-radius: 0; }
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .fgrid .full { grid-column: 1 / -1; }
  dialog { border: 3px solid var(--ink); background: var(--panel); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; }
  dialog::backdrop { background: rgba(27, 26, 51, 0.55); }
  .dlg-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .dlg-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .dlg-actions .spacer { flex: 1 1 auto; }
  .profiles { display: flex; flex-direction: column; gap: 6px; }
  .profiles button { justify-content: flex-start; }
  .profiles button[aria-pressed="true"] { background: var(--ink); color: var(--lec-ink); }
  .sec { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 2px solid var(--line); }
  .sec:first-child { padding-top: 0; border-top: 0; }
  .sec h3 { margin: 0; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  .err { color: var(--danger); font-size: 13px; font-weight: 600; margin: 0; }

  #toast { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--lec-ink); padding: 10px 16px; font-weight: 600; font-size: 14px; max-width: calc(100vw - 32px); z-index: 50; }
  footer { font-size: 13px; color: var(--muted); }

  @media (max-width: 600px) {
    .logo-svg { height: 46px; }
    nav.tabs { display: grid; grid-template-columns: 1.5fr repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
    nav.tabs button { padding: 0 2px; font-size: 13px; }
    nav.tabs .today { font-size: 10px; }
    nav.tabs.many .today { display: none; }
    .grid { min-width: 0; padding: 8px; gap: 5px; grid-template-columns: 38px repeat(var(--n, 5), minmax(0, 1fr)); }
    .cell { min-height: 58px; padding: 4px; align-items: center; justify-content: center; text-align: center; }
    .cell small { display: none; }
    .cell .abbr { font-size: 15px; flex-direction: column; align-items: center; gap: 4px; letter-spacing: -0.01em; }
    .half { font-size: 10px; padding: 1px 4px; }
    .cell.is-today { outline-width: 2px; outline-offset: 1px; }
    .time { padding-top: 2px; }
    .time b { font-size: 13px; }
    .time span { font-size: 11px; }
    .day-head h2 { font-size: 24px; }
    .fgrid { grid-template-columns: 1fr; }
  }
</style>
</head>

function welcomeView() {
  return `<section class="box hero" aria-labelledby="wt"><h2 id="wt">${esc(t('welcomeTitle'))}</h2><p>${esc(t('welcomeText'))}</p>
    <form id="welcomeForm" class="sec" style="border:0;padding:0"><label class="f">${esc(t('nameLabel'))}<input class="in" id="wName" maxlength="40" autocomplete="off" placeholder="${esc(t('namePh'))}"></label>
    <div class="toolbar"><button class="btn primary" type="submit">${esc(t('create'))}</button><button class="btn" type="button" data-act="example-new">${esc(t('tryExample'))}</button></div></form></section>`;
}
function emptyView() {
  return `<section class="box hero"><h2>${esc(t('emptyTitle'))}</h2><p>${esc(t('emptyText'))}</p>
    <div class="toolbar"><button class="btn primary" type="button" data-act="import">${esc(t('importIcs'))}</button><button class="btn" type="button" data-act="add">${esc(t('addClass'))}</button><button class="btn" type="button" data-act="example">${esc(t('tryExample'))}</button></div></section>`;
}
function kindOf(s) { return s.kind === 'sem' ? { cls: 'sem', label: t('seminar') } : { cls: 'lec', label: t('lecture') }; }
function weekView(p, days) {
  const reg = p.series.filter(s => !s.once);
  const rows = [...new Set(reg.map(s => s.start + '|' + s.end))].sort();
  let cells = '<span></span>' + days.map(d => `<span class="head">${esc(dayName(d, 'short'))}</span>`).join('');
  rows.forEach(r => {
    const [a, b] = r.split('|');
    cells += `<div class="time"><b>${a}</b><span>${b}</span></div>`;
    days.forEach(d => {
      const items = reg.filter(s => s.day === d && s.start === a && s.end === b);
      cells += items.length
        ? `<div class="cellwrap">${items.map(s => {
          const k = kindOf(s);
          return `<button type="button" class="cell ${k.cls}${d === todayDow ? ' is-today' : ''}" data-edit="${esc(s.id)}" aria-label="${esc(dayName(d, 'long') + ', ' + a + ': ' + s.title)}">
            <span class="abbr">${esc(abbr(s.title))}${s.every > 1 ? '<span class="half" title="' + esc(freqLabel(s)) + '">' + (s.every === 2 ? '½' : '1/' + s.every) + '</span>' : ''}</span>
            <small><b>${esc(k.label)}</b>${s.room ? '<br>' + esc(s.room) : ''}</small></button>`;
        }).join('')}</div>`
        : '<div class="cell empty" aria-hidden="true"></div>';
    });
  });
  const subjects = [...new Map(p.series.map(s => [s.title, abbr(s.title)])).entries()];
  const once = p.series.filter(s => s.once).sort((a, b) => a.once.localeCompare(b.once) || a.start.localeCompare(b.start));
  return `<section class="box grid-scroll" aria-label="${esc(t('week'))}"><div class="grid" style="--n:${days.length}">${cells}</div></section>
    <div class="row">
      <section class="box wide"><h2 class="bar sem">${esc(t('subjects'))}</h2><div class="list">${subjects.map(([n, a]) => `<div><b>${esc(a)}</b><span>${esc(n)}</span></div>`).join('')}</div></section>
      <section class="box"><h2 class="bar lec">${esc(t('legend'))}</h2><div class="list">
        <div><span class="sw lec"></span>${esc(t('lecture'))}</div><div><span class="sw sem"></span>${esc(t('seminar'))}</div>
        <div><span class="half">½</span>${esc(t('biweekly'))}</div></div></section>
    </div>` +
    (once.length ? `<section class="box"><h2 class="bar lec">${esc(t('oneTimeTitle'))}</h2>${once.map(s => `<div class="once-row"><span>${esc(dateLabel(s.once))} · ${s.start}–${s.end}</span><span class="grow">${esc(s.title)}${s.room ? ' · ' + esc(s.room) : ''}</span><button type="button" class="btn small" data-edit="${esc(s.id)}">${esc(t('edit'))}</button></div>`).join('')}</section>` : '');
}
function dayView(p, d) {
  const list = p.series.filter(s => !s.once && s.day === d).sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
  const first = list[0], last = list.reduce((m, s) => (s.end > m ? s.end : m), '00:00');
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const cards = list.map(s => {
    const k = kindOf(s);
    const live = d === todayDow && nowMin >= toMin(s.start) && nowMin < toMin(s.end);
    return `<section class="box"><div class="bar ${k.cls}"><span>${esc(k.label)}</span><span>${s.start}–${s.end}</span></div>
      <div class="card-body"><div class="card-main"><div class="card-title">${esc(s.title)}</div>
        ${s.room ? `<div>${esc(s.room)}</div>` : ''}${s.teacher ? `<div>${esc(t('teacherPrefix'))}: ${esc(s.teacher)}</div>` : ''}</div>
        <div class="tags">${live ? `<span class="tag now">${esc(t('now'))}</span>` : ''}<span class="tag${s.every > 1 ? ' b' : ''}">${esc(freqLabel(s))}</span>
        <button type="button" class="btn small" data-edit="${esc(s.id)}">${esc(t('edit'))}</button></div></div></section>`;
  }).join('');
  const pic = PICS[(d - 1) % PICS.length];
  return `<div class="day-head"><h2>${esc(dayName(d, 'long'))}${d === todayDow ? ' · ' + esc(t('today')) : ''}</h2><span>${esc(t('classes', list.length))} · ${first.start}–${last}</span></div>
    <div class="cards">${cards}</div><div class="pic"><img src="${pic}" alt=""></div>`;
}

/* ───────── dialogs ───────── */
const dlg = $('#dlg');
function openDialog(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeDialog() { if (dlg.open) dlg.close(); }
function editDialog(id) {
  const p = profile();
  const s = id ? p.series.find(x => x.id === id) : { id: null, title: '', teacher: '', room: '', kind: 'lec', day: typeof tab === 'number' ? tab : (todayDow <= 5 ? todayDow : 1), start: '09:00', end: '10:30', every: 1, once: null };
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;
  const dayOpts = [1, 2, 3, 4, 5, 6, 7].map(d => opt(d, dayName(d, 'long'), s.day)).join('');
  const repOpts = [1, 2, 3, 4].map(n => opt(n, n === 1 ? t('everyWeek') : n === 2 ? t('biweekly') : t('everyN', n), s.every)).join('');
  openDialog(`<form id="editForm" class="dlg-body" data-id="${esc(s.id || '')}">
    <h2 style="margin:0;font-size:20px">${esc(id ? t('editClass') : t('newClass'))}</h2>
    <div class="fgrid">
      <label class="f full">${esc(t('fTitle'))}<input class="in" name="title" maxlength="120" value="${esc(s.title)}" required></label>
      <label class="f">${esc(t('fTeacher'))}<input class="in" name="teacher" maxlength="80" value="${esc(s.teacher)}"></label>
      <label class="f">${esc(t('fRoom'))}<input class="in" name="room" maxlength="80" value="${esc(s.room)}"></label>
      <label class="f">${esc(t('fType'))}<select class="in" name="kind">${opt('lec', t('lecture'), s.kind)}${opt('sem', t('seminar'), s.kind)}</select></label>
      ${s.once
        ? `<label class="f">${esc(t('fDate'))}<input class="in" type="date" name="date" value="${esc(s.once)}"></label>`
        : `<label class="f">${esc(t('fDay'))}<select class="in" name="day">${dayOpts}</select></label>`}
      <label class="f">${esc(t('fStart'))}<input class="in" type="time" name="start" value="${esc(s.start)}" required></label>
      <label class="f">${esc(t('fEnd'))}<input class="in" type="time" name="end" value="${esc(s.end)}" required></label>
      ${s.once ? '' : `<label class="f full">${esc(t('fRepeat'))}<select class="in" name="every">${repOpts}</select></label>`}
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="dlg-actions">${id ? `<button type="button" class="btn danger" data-act="delete-class">${esc(t('del'))}</button>` : ''}<span class="spacer"></span>
      <button type="button" class="btn" data-act="close">${esc(t('cancel'))}</button><button type="submit" class="btn primary">${esc(t('save'))}</button></div></form>`);
}
function settingsDialog() {
  const p = profile();
  openDialog(`<div class="dlg-body">
    <h2 style="margin:0;font-size:20px">${esc(t('settings'))}</h2>
    <div class="sec"><label class="f">${esc(t('profileName'))}<input class="in" id="renameIn" maxlength="40" value="${esc(p.name)}"></label>
      <div class="toolbar"><button type="button" class="btn small" data-act="rename">${esc(t('rename'))}</button></div></div>
    <div class="sec"><h3>${esc(t('profilesTitle'))}</h3><div class="profiles">${state.profiles.map(q => `<button type="button" class="btn small" data-switch="${esc(q.id)}" aria-pressed="${q.id === p.id}">${esc(q.name)}</button>`).join('')}</div>
      <div class="toolbar"><input class="in" id="newProfIn" maxlength="40" placeholder="${esc(t('namePh'))}" aria-label="${esc(t('newProfile'))}" style="flex:1 1 140px;width:auto"><button type="button" class="btn small" data-act="new-profile">${esc(t('newProfile'))}</button></div></div>
    <div class="sec"><h3>${esc(t('backupTitle'))}</h3><div class="toolbar"><button type="button" class="btn small" data-act="export">${esc(t('exportBackup'))}</button><button type="button" class="btn small" data-act="restore">${esc(t('importBackup'))}</button></div></div>
    <div class="sec"><button type="button" class="btn danger small" data-act="delete-profile">${esc(t('delProfile'))}</button></div>
    <div class="dlg-actions"><button type="button" class="btn" data-act="close">${esc(t('close'))}</button></div></div>`);
}
function chooseDialog(message, onReplace, onAdd) {
  openDialog(`<div class="dlg-body"><p style="margin:0">${esc(message)}</p><div class="dlg-actions">
    <button type="button" class="btn" data-act="close">${esc(t('cancel'))}</button><button type="button" class="btn" id="chAdd">${esc(t('add'))}</button><button type="button" class="btn primary" id="chRep">${esc(t('replace'))}</button></div></div>`);
  $('#chAdd').onclick = () => { closeDialog(); onAdd(); };
  $('#chRep').onclick = () => { closeDialog(); onReplace(); };
}

/* ───────── actions ───────── */
function applyImport(list, mode) {
  const p = profile();
  p.series = mode === 'replace' ? list : p.series.concat(list);
  persist(); tab = null; render();
  toast(t('imported', list.length));
}
async function handleIcs(file) {
  if (!file) return;
  let list = null;
  try { list = importFromText(await file.text()); } catch (e) { list = null; }
  if (list === null) { toast(t('importFailed')); return; }
  if (!list.length) { toast(t('importNone')); return; }
  const p = profile();
  if (p.series.length) chooseDialog(t('replaceOrAdd'), () => applyImport(list, 'replace'), () => applyImport(list, 'add'));
  else applyImport(list, 'replace');
}
function exportBackup() {
  const p = profile();
  const blob = new Blob([JSON.stringify({ daybook: 1, name: p.name, series: p.series }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'daybook-' + p.name.replace(/[^\p{L}\p{N}_-]+/gu, '_') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const cleanSeries = s => ({
  id: uid(), title: String(s.title || '—').slice(0, 120), teacher: String(s.teacher || '').slice(0, 80), room: String(s.room || '').slice(0, 80),
  kind: s.kind === 'sem' ? 'sem' : 'lec', day: Math.min(7, Math.max(1, +s.day || 1)),
  start: /^\d\d:\d\d$/.test(s.start) ? s.start : '09:00', end: /^\d\d:\d\d$/.test(s.end) ? s.end : '10:30',
  every: Math.min(4, Math.max(1, +s.every || 1)), once: /^\d{4}-\d\d-\d\d$/.test(s.once || '') ? s.once : null
});
async function handleBackup(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.daybook !== 1 || !Array.isArray(data.series)) throw new Error('shape');
    newProfile(String(data.name || '').slice(0, 40), data.series.slice(0, 500).map(cleanSeries));
    closeDialog(); tab = null; render(); toast(t('backupRestored'));
  } catch (e) { toast(t('backupInvalid')); }
}

/* ───────── events ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lang],[data-tab],[data-edit],[data-act],[data-switch]');
  if (!el) return;
  if (el.dataset.lang) { state.lang = el.dataset.lang; persist(); render(); return; }
  if (el.dataset.tab) { tab = el.dataset.tab === 'week' ? 'week' : +el.dataset.tab; try { history.replaceState(null, '', '#' + (tab === 'week' ? 'week' : TAB_IDS[tab - 1])); } catch (_) {} render(); return; }
  if (el.dataset.edit) { editDialog(el.dataset.edit); return; }
  if (el.dataset.switch) { state.current = el.dataset.switch; persist(); tab = null; closeDialog(); render(); return; }
  const a = el.dataset.act;
  if (a === 'import') $('#icsInput').click();
  else if (a === 'add') editDialog(null);
  else if (a === 'close') closeDialog();
  else if (a === 'example-new') { newProfile(t('exampleName'), exampleSeries()); tab = null; render(); }
  else if (a === 'example') { profile().series = exampleSeries(); persist(); tab = null; render(); }
  else if (a === 'rename') { const v = $('#renameIn').value.trim(); if (v) { profile().name = v.slice(0, 40); persist(); render(); settingsDialog(); toast(t('saved')); } }
  else if (a === 'new-profile') { newProfile($('#newProfIn').value); tab = null; closeDialog(); render(); }
  else if (a === 'export') exportBackup();
  else if (a === 'restore') $('#backupInput').click();
  else if (a === 'delete-class') {
    if (!el.classList.contains('sure')) { el.classList.add('sure'); el.textContent = t('delSure'); return; }
    const p = profile(), id = $('#editForm').dataset.id;
    p.series = p.series.filter(s => s.id !== id); persist(); closeDialog(); render(); toast(t('deleted'));
  } else if (a === 'delete-profile') {
    if (!el.classList.contains('sure')) { el.classList.add('sure'); el.textContent = t('delProfileSure'); return; }
    state.profiles = state.profiles.filter(q => q.id !== state.current);
    state.current = state.profiles[0]?.id || null; persist(); tab = null; closeDialog(); render();
  }
});
$('#settingsBtn').addEventListener('click', settingsDialog);
$('#icsInput').addEventListener('change', e => { handleIcs(e.target.files[0]); e.target.value = ''; });
$('#backupInput').addEventListener('change', e => { handleBackup(e.target.files[0]); e.target.value = ''; });
document.addEventListener('submit', e => {
  if (e.target.id === 'welcomeForm') { e.preventDefault(); newProfile($('#wName').value); tab = null; render(); return; }
  if (e.target.id !== 'editForm') return;
  e.preventDefault();
  const f = new FormData(e.target), id = e.target.dataset.id, p = profile();
  const err = m => { const el = $('#formErr'); el.textContent = m; el.hidden = false; };
  const title = String(f.get('title') || '').trim();
  if (!title) return err(t('errTitle'));
  const start = f.get('start'), end = f.get('end');
  if (!start || !end || end <= start) return err(t('errTime'));
  const cur = id ? p.series.find(s => s.id === id) : null;
  const next = Object.assign(cur || { id: uid(), once: null, every: 1, day: 1 }, {
    title, teacher: String(f.get('teacher') || '').trim(), room: String(f.get('room') || '').trim(), kind: f.get('kind') === 'sem' ? 'sem' : 'lec', start, end
  });
  if (next.once) {
    const d = f.get('date'); if (!d) return err(t('errDate'));
    next.once = d; next.day = dowOf(new Date(d + 'T00:00'));
  } else { next.day = +f.get('day') || 1; next.every = +f.get('every') || 1; }
  if (!cur) p.series.push(next);
  persist(); closeDialog(); render(); toast(t('saved'));
});
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });

/* ───────── start ───────── */
(function init() {
  const h = location.hash.slice(1);
  if (h === 'week') tab = 'week';
  else if (TAB_IDS.includes(h)) tab = TAB_IDS.indexOf(h) + 1;
  else tab = todayDow <= 7 ? todayDow : 'week';
  render();
})();
</script>
</body>
</html>
